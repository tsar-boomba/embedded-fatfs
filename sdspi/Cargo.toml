[package]
name = "sdspi"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-hal-async = "1"
embedded-hal = "1"
sdio-host = "0.9.0"
block-device-driver = { version = "0.2.0", path = "../block-device-driver" }
embassy-futures = "0.1.1"
aligned = "0.4.2"

log = { version = "0.4", optional = true }
defmt = { version = "1", optional = true }

[features]
# enable log support
log = ["dep:log"]
# enable defmt support
defmt = ["dep:defmt"]
# Place the CRC lookup table (512 bytes) in RAM instead of flash. Needs a linker script that
# loads `.data.*` input sections into RAM, as cortex-m-rt's does.
crc-table-in-ram = []
